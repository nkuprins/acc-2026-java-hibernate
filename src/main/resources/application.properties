spring.application.name=hibernate-practical

spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

external-service.base-url=https://external-api.acnbootcamp.lv/api
# The bootcamp service does not check it. It is sent to show a secured outbound call.
external-service.token=${EXTERNAL_SERVICE_TOKEN:}